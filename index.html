<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RT Pay — your paycheck auditor</title>
    <meta name="description" content="Know what the check should say before it lands." />
    <link rel="icon" href="%BASE_URL%pwa-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <!-- iOS launch images: it picks one only on an EXACT device-width/height/ratio
         match, so these must stay in lockstep with TARGETS in scripts/gen-splash.mjs -->
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%BASE_URL%splash/splash-430x932-3x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%BASE_URL%splash/splash-428x926-3x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%BASE_URL%splash/splash-393x852-3x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%BASE_URL%splash/splash-390x844-3x.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="%BASE_URL%splash/splash-820x1180-2x.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4efe6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171310" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RT Pay" />
    <!-- paint the right paper BEFORE any JS/CSS loads — no cream flash on dark launches -->
    <style>
      html { background: #f4efe6; }
      @media (prefers-color-scheme: dark) { html { background: #171310; } }
      html[data-mode="dark"] { background: #171310; }
      html[data-mode="light"] { background: #f4efe6; }
    </style>
    <script>
      try {
        var m = localStorage.getItem("rtpay-mode");
        if (m === "dark" || m === "light") document.documentElement.dataset.mode = m;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
